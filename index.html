<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний Вишлист Дениски 🎄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
        }
        /* Падающий снег */
        @keyframes snowfall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) translateX(25px) rotate(180deg);
            }
            100% {
                transform: translateY(105vh) translateX(-15px) rotate(360deg);
                opacity: 0.2;
            }
        }
        .snowflake {
            position: fixed;
            top: -10vh;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: snowfall linear infinite;
        }
        /* Стеклянный эффект и свечение */
        .card-glass {
            background: rgba(17, 24, 39, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .garland-glow {
            background: radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.18), rgba(245, 158, 11, 0.12), transparent 70%);
        }
        /* Плавное скрытие скроллбара для табов */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <!-- Фоновое праздничное свечение -->
    <div class="fixed inset-0 garland-glow pointer-events-none z-0"></div>

    <!-- Анимированные снежинки -->
    <div id="snow-container" aria-hidden="true"></div>

        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
            <i id="toast-icon" class="fa-solid fa-check"></i>
        </div>
        <span id="toast-message" class="text-sm font-medium">Артикул скопирован!</span>
    </div>
